<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบค้นหาคำตอบ — วัดความรู้ทหารช่าง</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", sans-serif;
      padding: 14px;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    
    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #00e676;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .search-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background-color: #1e1e1e;
      border: 2px solid #333333;
      border-radius: 8px;
      font-size: 16px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #00e676;
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.3);
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    .btn-search {
      flex: 2;
      padding: 12px;
      background-color: #00c853;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-search:active {
      transform: scale(0.98);
      background-color: #00e676;
    }

    .btn-reset {
      flex: 1;
      padding: 12px;
      background-color: #333333;
      color: #e0e0e0;
      border: 1px solid #444444;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-reset:active {
      transform: scale(0.98);
      background-color: #444444;
    }

    .result-card {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #2d2d2d;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .question {
      font-size: 15px;
      font-weight: 600;
      color: #e0e0e0;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .answer-box {
      background-color: #002b19;
      border: 1px solid #005c37;
      border-radius: 6px;
      padding: 10px 12px;
    }

    .answer-title {
      font-size: 12px;
      font-weight: bold;
      color: #00e676;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .answer-text {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.4;
      word-break: break-word;
    }

    .no-result {
      text-align: center;
      color: #888888;
      font-size: 14px;
      margin-top: 30px;
    }

    .loading {
      text-align: center;
      color: #00e676;
      font-size: 15px;
      font-weight: bold;
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="header-title">⚡ ทดสอบความรู้เหล่าทหารช่าง</div>

  <div class="search-container">
    <input type="text" id="query" placeholder="พิมพ์คำถามหรือคีย์เวิร์ด..." onkeypress="handleKeyPress(event)" autocomplete="off">
    <div class="button-group">
      <button class="btn-search" onclick="doSearch()">ค้นหาคำตอบ</button>
      <button class="btn-reset" onclick="resetForm()">Reset คำถาม</button>
    </div>
  </div>

  <div id="loading" class="loading">⏳ กำลังค้นหาข้อมูล...</div>
  <div id="results"></div>

  <script>
    // 🔴 วาง URL ที่ได้จาก Apps Script ที่นี่ (ต้องอยู่ในเครื่องหมายคำพูด)
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzv6nQdEXhrbdjNC6C0m8y3-Dvp4vIWh65j8egkInx0tgdQuRG2w2zM-Qt3ARAyWT1mAQ/exec";

    function handleKeyPress(e) {
      if (e.keyCode === 13) {
        document.getElementById('query').blur();
        doSearch();
      }
    }

    async function doSearch() {
      var query = document.getElementById('query').value;
      if (!query.trim()) return;

      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').innerHTML = '';

      try {
        const response = await fetch(GAS_URL + "?q=" + encodeURIComponent(query));
        const data = await response.json();
        showResults(data);
      } catch (err) {
        showError(err);
      }
    }

    function resetForm() {
      document.getElementById('query').value = '';
      document.getElementById('results').innerHTML = '';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('query').focus();
    }

    function showResults(data) {
      document.getElementById('loading').style.display = 'none';
      var container = document.getElementById('results');

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="no-result">❌ ไม่พบคำตอบที่เกี่ยวข้อง<br>โปรดลองใช้คำค้นหาอื่น</div>';
        return;
      }

      var html = '';
      var item = data[0];
      html += '<div class="result-card">';
      html += '<div class="question">Q: ' + escapeHtml(item.question) + '</div>';
      html += '<div class="answer-box">';
      html += '<div class="answer-title">คำตอบที่ถูกต้อง:</div>';
      html += '<div class="answer-text">' + escapeHtml(item.answer) + '</div>';
      html += '</div>';
      html += '</div>';

      container.innerHTML = html;
    }

    function showError(err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('results').innerHTML = '<div class="no-result" style="color:#ff5252;">เกิดข้อผิดพลาด: ไม่สามารถดึงข้อมูลได้</div>';
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
